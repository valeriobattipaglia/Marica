<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171613">
<title>LEIB — Fashion, Art & Culture</title>
<style>
:root{color-scheme:dark;--stage:#4b4b49;--ink:#171613}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--stage)}
body{font-family:Georgia,"Times New Roman",serif}
.viewer{position:relative;width:100vw;height:100dvh;display:grid;place-items:center;overflow:hidden;background:var(--stage);touch-action:pinch-zoom}
.book-frame{position:relative;width:min(96vw,130dvh);height:min(92dvh,67.88vw);max-height:100dvh;filter:drop-shadow(0 22px 42px #0008)}
.book{position:absolute;left:0;top:0;width:min(96vw,130dvh);height:min(92dvh,67.88vw);max-height:100dvh;touch-action:pinch-zoom}
.book-frame.cover{width:min(48vw,65dvh);overflow:hidden}
.book-frame.cover .book{left:-100%}
.nav{position:fixed;z-index:10;top:0;bottom:0;width:12vw;min-width:42px;max-width:150px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;opacity:.42;transition:opacity .2s;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav:hover,.nav:focus-visible{opacity:.9;outline:none}
.sound-toggle{position:fixed;z-index:12;right:12px;bottom:12px;border:1px solid #ffffff50;border-radius:999px;padding:8px 12px;background:#171613bb;color:#fff;font:12px system-ui,sans-serif;cursor:pointer;opacity:.72;backdrop-filter:blur(8px)}.sound-toggle:focus-visible{outline:2px solid #fff;outline-offset:3px}
.page-status{position:fixed;z-index:10;left:50%;bottom:16px;transform:translateX(-50%);color:#fff;font:12px system-ui,sans-serif;text-shadow:0 1px 3px #000;pointer-events:none}
.nav:after{content:"";width:38px;height:38px;border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;filter:drop-shadow(0 1px 3px #0008)}
.prev{left:0}.prev:after{transform:rotate(-135deg)}.next{right:0}.next:after{transform:rotate(45deg)}
@media(max-width:700px){
 .book-frame,.book{width:96vw;height:min(67.88vw,70dvh);max-height:70dvh}
 .book-frame.cover{width:48vw}
 .nav{width:10vw;min-width:30px;opacity:.34}
 .nav:after{width:17px;height:17px}
}
@media(prefers-reduced-motion:reduce){.nav{transition:none}}
</style>
</head>
<body>
<main class="viewer" aria-label="Rivista LEIB">
  <div class="book-frame cover" id="bookFrame">
    <div class="book" id="book" aria-label="Pagine della rivista LEIB"></div>
  </div>
  <button class="nav prev" id="prev" aria-label="Pagina precedente" title="Pagina precedente"></button>
  <button class="nav next" id="next" aria-label="Pagina successiva" title="Pagina successiva"></button>
  <output class="page-status" id="pageStatus" aria-live="polite">1 / 128</output>
  <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false">Suono: off</button>
</main>
<script src="vendor/page-flip.browser.min.js"></script>
<script>
(() => {
  const TOTAL = 128;
  let soundEnabled = false;
  let soundContext = null;
  const bookFrame = document.getElementById('bookFrame');
  const book = document.getElementById('book');
  const src = n => `pages/page-${String(n).padStart(3,'0')}.jpg`;
  const pageFlip = new St.PageFlip(book,{
    width:700,
    height:990,
    size:'stretch',
    minWidth:150,
    maxWidth:1400,
    minHeight:170,
    maxHeight:1200,
    autoSize:false,
    showCover:true,
    usePortrait:false,
    flippingTime:650,
    drawShadow:true,
    maxShadowOpacity:.48,
    mobileScrollSupport:false,
    swipeDistance:30,
    clickEventForward:false,
    disableFlipByClick:true,
    useMouseEvents:false
  });
  function updateControls(index=pageFlip.getCurrentPageIndex()){
    const portrait=pageFlip.getOrientation()==='portrait';
    const last=portrait?TOTAL-1:TOTAL-2;
    document.getElementById('prev').style.visibility=index===0?'hidden':'visible';
    document.getElementById('next').style.visibility=index>=last?'hidden':'visible';
    document.getElementById('pageStatus').textContent=index===0?'1 / 128':portrait?`${index+1} / 128`:`${index+1}-${Math.min(index+2,TOTAL)} / 128`;
  }
  function syncBookSize(index){
    const cover=index===0;
    bookFrame.classList.toggle('cover',cover);
  }
  function playPageSound(){
    if(!soundEnabled) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(!AudioCtx) return;
      soundContext = soundContext || new AudioCtx();
      if(soundContext.state === 'suspended') soundContext.resume();
      const now = soundContext.currentTime;
      const buffer = soundContext.createBuffer(1, Math.floor(soundContext.sampleRate * 0.075), soundContext.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*(1-i/data.length);
      const source = soundContext.createBufferSource();
      const filter = soundContext.createBiquadFilter();
      const gain = soundContext.createGain();
      source.buffer=buffer; filter.type='lowpass'; filter.frequency.setValueAtTime(1700,now);
      gain.gain.setValueAtTime(0.0001,now); gain.gain.exponentialRampToValueAtTime(0.10,now+0.008); gain.gain.exponentialRampToValueAtTime(0.0001,now+0.075);
      source.connect(filter); filter.connect(gain); gain.connect(soundContext.destination); source.start(now); source.stop(now+0.08);
    } catch (_) {}
  }
  document.getElementById('soundToggle').addEventListener('click',()=>{
    soundEnabled=!soundEnabled;
    const button=document.getElementById('soundToggle');
    button.textContent=`Suono: ${soundEnabled?'on':'off'}`;
    button.setAttribute('aria-pressed',String(soundEnabled));
    if(soundEnabled) playPageSound();
  });
  pageFlip.on('flip',event=>{
    syncBookSize(event.data);
    updateControls(event.data);
    playPageSound();
  });
  pageFlip.on('changeOrientation',()=>updateControls());
  pageFlip.on('init',event=>{
    syncBookSize(event.data.page);
    updateControls(event.data.page);
  });
  pageFlip.loadFromImages(Array.from({length:TOTAL},(_,index)=>src(index+1)));
  document.getElementById('next').addEventListener('click',()=>pageFlip.flipNext('top'));
  document.getElementById('prev').addEventListener('click',()=>pageFlip.flipPrev('top'));
  let gestureStart=null;
  const activePointers=new Set();
  const viewer=document.querySelector('.viewer');
  viewer.addEventListener('pointerdown',event=>{
    if(event.pointerType==='mouse' && event.button!==0) return;
    if(event.target.closest('button')) return;
    activePointers.add(event.pointerId);
    if(activePointers.size>1){gestureStart=null;return;}
    gestureStart={x:event.clientX,y:event.clientY,id:event.pointerId};
  });
  viewer.addEventListener('pointerup',event=>{
    activePointers.delete(event.pointerId);
    if(!gestureStart || gestureStart.id!==event.pointerId || activePointers.size>0) return;
    const dx=event.clientX-gestureStart.x,dy=event.clientY-gestureStart.y;
    gestureStart=null;
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0) pageFlip.flipNext('top');
      else pageFlip.flipPrev('top');
    }
  });
  viewer.addEventListener('pointercancel',event=>{
    activePointers.delete(event.pointerId);
    gestureStart=null;
  });
  document.addEventListener('keydown',e=>{
    if(e.target.closest('button,input,textarea,select')) return;
    if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();pageFlip.flipNext('top');}
    if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();pageFlip.flipPrev('top');}
    if(e.key==='Home') pageFlip.turnToPage(0);
    if(e.key==='End') pageFlip.turnToPage(TOTAL-1);
  });
  updateControls();
})();
</script>
</body>
</html>
